[workspace]
resolver = "3"
members = ["crates/core", "crates/solver", "crates/cli", "crates/wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
accordion-core = { path = "crates/core" }
accordion-solver = { path = "crates/solver" }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Native runs and benchmarks; wasm-pack builds the browser engine with this profile too.
# target-cpu=native is set per target in .cargo/config.toml, so the WASM build stays portable.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
debug = "line-tables-only"   # keeps profiler stacks readable at no runtime cost

[profile.bench]
inherits = "release"         # benches always unwind, whatever panic = says
