[package]
name = "accordion-gpu"
description = "NVIDIA GPU attempts (CUDA, compiled by NVRTC when a run starts) that `acc batch` runs beside the CPU solver; `accgpu` times the GPU alone"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[[bin]]
name = "accgpu"
path = "src/main.rs"

[dependencies]
accordion-core.workspace = true
accordion-solver.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
cudarc = { version = "=0.19.10", default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-12090"] }

[lints]
workspace = true
