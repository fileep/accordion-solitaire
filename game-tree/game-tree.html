<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accordion game trees</title>
<style>
html,body{margin:0;height:100%;background:#05060a}
body.standalone #acc-tree{position:fixed;left:0;top:0;right:0;bottom:0;width:auto;height:auto;border-radius:0;margin:0}
</style>
</head>
<body class="standalone">
<!-- acc-tree: everything from here to "end of acc-tree" can be pasted into a blog post as it is -->
<style>
#acc-tree{position:relative;width:100%;height:680px;margin:1em 0;background:#05060a;color:#d9dce4;border-radius:10px;overflow:hidden;
  font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;user-select:none;-webkit-user-select:none}
#acc-tree:fullscreen{width:100%;height:100%;margin:0;border-radius:0}
#acc-tree:-webkit-full-screen{width:100%;height:100%;margin:0;border-radius:0}
#acc-tree *{box-sizing:border-box}
#acc-tree canvas.at-gl{position:absolute;left:0;top:0;width:100%;height:100%;display:block;cursor:grab;touch-action:pan-y}
/* In a page, one finger scrolls the page up and down; on its own page or full screen every touch drives the tree. */
body.standalone #acc-tree canvas.at-gl,#acc-tree:fullscreen canvas.at-gl,#acc-tree:-webkit-full-screen canvas.at-gl{touch-action:none}
#acc-tree canvas.at-gl.at-dragging{cursor:grabbing}
#acc-tree button,#acc-tree select,#acc-tree input{font:inherit;color:#e8eaf0;background:#161a26;border:1px solid #2c3346;border-radius:6px;padding:4px 8px;margin:0}
#acc-tree button{cursor:pointer}
#acc-tree button:hover,#acc-tree select:hover{background:#1f2536}
#acc-tree button.on{background:#2c3a63;border-color:#4d64a8}
#acc-tree input.at-seed{width:9.5em}
#acc-tree .at-top{position:absolute;left:8px;right:8px;top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;pointer-events:none}
#acc-tree .at-top>*{pointer-events:auto}
#acc-tree .at-top select.at-ex{max-width:22em}
#acc-tree .at-panel{background:rgba(9,11,18,.82);border:1px solid #232a3b;border-radius:8px;padding:8px 10px}
#acc-tree .at-side{position:absolute;left:8px;top:var(--tb,48px);width:280px;max-height:calc(100% - var(--tb,48px) - 8px);overflow:auto}
#acc-tree .at-side.at-folded .at-body{display:none}
#acc-tree .at-title{font-weight:600;font-size:14px;cursor:pointer}
#acc-tree .at-title::after{content:" \25BE";color:#7d869c;font-weight:400}
#acc-tree .at-side.at-folded .at-title::after{content:" \25B8"}
#acc-tree .at-note{color:#aab1c2;margin:4px 0 6px}
#acc-tree .at-stats{margin:4px 0}
#acc-tree .at-stats b{color:#fff;font-weight:600}
#acc-tree canvas.at-chart{width:100%;height:64px;display:block;margin:6px 0 2px}
#acc-tree .at-chartcap{color:#7d869c;font-size:11px}
#acc-tree .at-legend{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:#b9bfcd}
#acc-tree .at-legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
#acc-tree .at-tools{position:absolute;right:8px;top:var(--tb,48px);display:flex;flex-direction:column;gap:5px;align-items:stretch;width:150px}
#acc-tree .at-tools .at-row{display:flex;gap:4px}
#acc-tree .at-tools .at-row>*{flex:1}
#acc-tree .at-tools label{font-size:11px;color:#8d96aa;display:flex;align-items:center;gap:4px}
#acc-tree .at-tools input[type=range]{flex:1;width:60px;padding:0}
#acc-tree .at-node{position:absolute;right:8px;bottom:8px;width:340px;max-width:calc(100% - 16px);max-height:calc(100% - 330px);min-height:120px;overflow:auto}
#acc-tree .at-node-head{margin-bottom:6px}
#acc-tree .at-cards{display:flex;flex-wrap:wrap;gap:3px;margin:6px 0}
#acc-tree .at-card{width:24px;height:30px;border-radius:4px;background:#f3f1ea;color:#1b1d22;font-weight:700;font-size:11px;line-height:1;display:flex;
  flex-direction:column;align-items:center;justify-content:center;font-family:Georgia,"Times New Roman",serif}
#acc-tree .at-card.at-red{color:#c4102a}
#acc-tree .at-card span{font-size:13px}
#acc-tree .at-node-btns{display:flex;gap:6px;flex-wrap:wrap}
#acc-tree .at-crumbs{display:flex;gap:6px;align-items:center;max-width:100%}
#acc-tree .at-hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);pointer-events:none;font-size:12px;padding:5px 9px}
#acc-tree .at-crumbs:empty{display:none}
#acc-tree .at-busy{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:320px;text-align:center}
#acc-tree .at-bar{height:6px;background:#1b2030;border-radius:3px;overflow:hidden;margin-bottom:6px}
#acc-tree .at-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3d6bff,#38e3a0)}

  white-space:nowrap;transform:translate(12px,12px)}
#acc-tree .at-helpbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;
  font-size:13px;line-height:1.45}
#acc-tree .at-helpbox p{margin:0 0 8px}
#acc-tree .at-msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:420px;text-align:center}
#acc-tree [hidden]{display:none !important}
#acc-tree.at-narrow{font-size:12px}
#acc-tree.at-narrow .at-side{width:200px;padding:6px 8px}
#acc-tree.at-narrow .at-tools{width:108px;gap:4px}
#acc-tree.at-narrow .at-tools button,#acc-tree.at-narrow .at-tools select{padding:3px 4px;font-size:12px}
#acc-tree.at-narrow input.at-seed{width:7.5em}
#acc-tree.at-narrow .at-top select.at-ex{max-width:100%}
#acc-tree.at-narrow .at-node{width:calc(100% - 16px);max-height:42%;min-height:0}
@media (max-width:600px){#acc-tree{height:620px;height:min(620px,80vh)}}
</style>
<div id="acc-tree"></div>
<script>
(function(){
'use strict';
var host=document.getElementById('acc-tree');
if(!host||host.getAttribute('data-ready'))return;
host.setAttribute('data-ready','1');

// ---------- cards and deals (the same generator as acc and the game) ----------
var RANKS='A23456789TJQK',SUITS='CDHS',SYM=['\u2663','\u2666','\u2665','\u2660'];
function cardByte(s){return SUITS.indexOf(s[1])<<4|RANKS.indexOf(s[0]);}
function cardText(b){return (RANKS[b&15]==='T'?'10':RANKS[b&15])+SYM[b>>4];}
function isRed(b){var s=b>>4;return s===1||s===2;}
// <deal>
var MASK=(1n<<64n)-1n;
function rotl(x,k){return ((x<<k)|(x>>(64n-k)))&MASK;}
function dealFromSeed(seed){
  var st=BigInt(seed);
  function mix(){st=(st+0x9E3779B97F4A7C15n)&MASK;var z=st;z=((z^(z>>30n))*0xBF58476D1CE4E5B9n)&MASK;z=((z^(z>>27n))*0x94D049BB133111EBn)&MASK;return z^(z>>31n);}
  var s=[mix(),mix(),mix(),mix()];
  function next(){var r=(rotl((s[1]*5n)&MASK,7n)*9n)&MASK,t=(s[1]<<17n)&MASK;s[2]^=s[0];s[3]^=s[1];s[1]^=s[2];s[0]^=s[3];s[2]^=t;s[3]=rotl(s[3],45n);return r;}
  function below(b){var n=BigInt(b);var m=next()*n;if((m&MASK)<n){var t=((1n<<64n)-n)%n;while((m&MASK)<t)m=next()*n;}return Number(m>>64n);}
  var d=[];for(var u=0;u<4;u++)for(var r=0;r<13;r++)d.push(u<<4|r);
  for(var i=51;i>0;i--){var j=below(i+1);var x=d[i];d[i]=d[j];d[j]=x;}
  return d;
}
// </deal>

// ---------- the engine: builds a deal's graph of positions in a Web Worker ----------
// <engine>
function workerMain(self){
  'use strict';
  var now=(typeof performance!=='undefined'&&performance.now)?function(){return performance.now();}:function(){return Date.now();};
  function grow(a,n){if(n<=a.length)return a;var m=a.length*2||1024;while(m<n)m*=2;var b=new a.constructor(m);b.set(a);return b;}
  // Positions are rows of top cards (a pile's lower cards never matter again), stored in an arena of bytes.
  var A,off,len,par,pmv,flag,head,hsh,eto,enext,emv,tab,tmask,N,NE,used,budget,SEEN,gen,lastPost,t0,phase,divesWonRuns;
  var SC=new Uint8Array(52*104),CM=new Uint8Array(104),WT=new Float64Array(104),UF=new Int32Array(17),rng=1;
  function rand(){rng^=rng<<13;rng^=rng>>>17;rng^=rng<<5;return (rng>>>0)/4294967296;}
  function reset(){
    A=new Uint8Array(1<<20);off=new Uint32Array(1<<14);len=new Uint8Array(1<<14);par=new Int32Array(1<<14);pmv=new Uint8Array(1<<14);
    flag=new Uint8Array(1<<14);head=new Int32Array(1<<14);hsh=new Uint32Array(1<<14);
    eto=new Int32Array(1<<16);enext=new Int32Array(1<<16);emv=new Uint8Array(1<<16);
    tab=new Int32Array(1<<15);tmask=tab.length-1;N=0;NE=0;used=0;SEEN=new Int32Array(1<<14);gen=0;
  }
  function hashOf(b,o,n){var h=(0x811c9dc5^n)|0;for(var k=0;k<n;k++)h=Math.imul(h^b[o+k],0x01000193);h^=h>>>16;h=Math.imul(h,0x85ebca6b);h^=h>>>13;h=Math.imul(h,0xc2b2ae35);h^=h>>>16;return h>>>0;}
  function find(b,o,n,h){
    var i=h&tmask;
    for(;;){var v=tab[i];if(v===0)return -1-i;var id=v-1;
      if(hsh[id]===h&&len[id]===n){var p=off[id],k=0;while(k<n&&A[p+k]===b[o+k])k++;if(k===n)return id;}
      i=(i+1)&tmask;}
  }
  function rehash(){var t=new Int32Array(tab.length*2),m=t.length-1;for(var id=0;id<N;id++){var i=hsh[id]&m;while(t[i])i=(i+1)&m;t[i]=id+1;}tab=t;tmask=m;}
  function insert(b,o,n,h,slot){
    if(N>=off.length){var m=N+1;off=grow(off,m);len=grow(len,m);par=grow(par,m);pmv=grow(pmv,m);flag=grow(flag,m);head=grow(head,m);hsh=grow(hsh,m);}
    if(used+n>A.length)A=grow(A,used+n);
    for(var k=0;k<n;k++)A[used+k]=b[o+k];
    off[N]=used;used+=n;len[N]=n;hsh[N]=h;head[N]=-1;par[N]=-1;pmv[N]=0;flag[N]=0;
    tab[-1-slot]=N+1;var id=N++;
    if(N*2>tab.length)rehash();
    return id;
  }
  function addEdge(u,v,m){if(NE>=eto.length){var k=NE+1;eto=grow(eto,k);enext=grow(enext,k);emv=grow(emv,k);}eto[NE]=v;emv[NE]=m;enext[NE]=head[u];head[u]=NE;NE++;}
  function hasEdge(u,v){for(var e=head[u];e>=0;e=enext[e])if(eto[e]===v)return true;return false;}
  // Every legal move from a position: a pile moves onto the pile 1 or 3 to its left if their top cards share a suit or rank.
  // The children go into SC (52 bytes apart) and their moves into CM, as pile<<1|leap.
  function children(id){
    var n=len[id],p=off[id],k=0;
    for(var i=1;i<n;i++){var c=A[p+i];
      for(var leap=0;leap<2;leap++){var d=leap?3:1;if(i<d)continue;var t=A[p+i-d],x=c^t;
        if((x&0xF0)===0||(x&0x0F)===0){var o=k*52,j;
          for(j=0;j<i;j++)SC[o+j]=A[p+j];SC[o+i-d]=c;for(j=i+1;j<n;j++)SC[o+j-1]=A[p+j];
          CM[k]=i<<1|leap;k++;}}}
    return k;
  }
  function expand(id){
    if(flag[id]&1)return;
    var k=children(id),n=len[id]-1;
    for(var j=0;j<k;j++){var o=j*52,h=hashOf(SC,o,n),c=find(SC,o,n,h);
      if(c<0){c=insert(SC,o,n,h,c);par[c]=id;pmv[c]=CM[j];}
      if(!hasEdge(id,c))addEdge(id,c,CM[j]);}
    flag[id]|=1;
  }
  // The solver's dead-end test: the top cards other than the leftmost must be linked by shared suits and ranks,
  // and the leftmost card (which never moves) must match one of them.
  function uf(x){while(UF[x]!==x){UF[x]=UF[UF[x]];x=UF[x];}return x;}
  function viable(o,n){
    if(n<=1)return true;
    var i,j;for(i=0;i<17;i++)UF[i]=i;
    for(j=1;j<n;j++){var c=SC[o+j],a=uf(c>>4),b=uf(4+(c&15));if(a!==b)UF[a]=b;}
    var r=uf(SC[o+1]>>4);for(j=2;j<n;j++)if(uf(SC[o+j]>>4)!==r)return false;
    var L=SC[o];for(j=1;j<n;j++){var x=SC[o+j]^L;if((x&0xF0)===0||(x&0x0F)===0)return true;}
    return false;
  }
  function progress(force){
    var t=now();if(!force&&t-lastPost<120)return;lastPost=t;
    self.postMessage({type:'progress',phase:phase,nodes:N,budget:budget,ms:Math.round(t-t0)});
  }
  // Every position below v, in order of depth, until cap new positions have been added. Says whether it met a win.
  function exhaust(v,cap){
    gen++;var q=[v],qi=0,start=N,won=false;if(SEEN.length<N+1)SEEN=grow(SEEN,N+1);SEEN[v]=gen;
    while(qi<q.length){var u=q[qi++];if(len[u]===1)won=true;
      if(!(flag[u]&1)){if(N-start>=cap)continue;expand(u);if(SEEN.length<N)SEEN=grow(SEEN,N);}
      for(var e=head[u];e>=0;e=enext[e]){var c=eto[e];if(SEEN[c]!==gen){SEEN[c]=gen;q.push(c);}}
      if((qi&255)===0)progress(false);}
    return won;
  }
  // A random line down from v, as the solver plays them: leaps 8 times as likely as slides, never into a dead end the
  // test can see. It stops at E piles, or where every move is such a dead end (then the position is lost: flag 2).
  function walk(v,E){
    var path=[v],j;
    while(len[v]>E){
      var k=children(v),n=len[v]-1;
      if(k===0){flag[v]|=1;break;}
      var tot=0;for(j=0;j<k;j++){var w=viable(j*52,n)?((CM[j]&1)?8:1):0;WT[j]=w;tot+=w;}
      if(tot===0){flag[v]|=6;break;}
      var r=rand()*tot,pick=k-1;for(j=0;j<k;j++){r-=WT[j];if(r<0){pick=j;break;}}
      var next=-1;
      for(j=0;j<k;j++){var o=j*52,h=hashOf(SC,o,n),c=find(SC,o,n,h);
        if(c<0){if(j!==pick)continue;c=insert(SC,o,n,h,c);par[c]=v;pmv[c]=CM[j];}
        if(!hasEdge(v,c))addEdge(v,c,CM[j]);
        if(j===pick)next=c;}
      v=next;path.push(v);
    }
    return path;
  }
  // A group of lines that branch like a tree: the first from the deal, each later one from a random point of the
  // earlier ones. Each line that reaches E piles gets every position below it searched.
  function branchOut(E,cap,ends,branches){
    var pool=[],before=N,won=0;
    for(var b=0;b<=branches&&N<budget;b++){
      var s=b?pool[(rand()*pool.length)|0]:0;if(len[s]<=E)continue;
      var p=walk(s,E),end=p[p.length-1];ends.push(end);
      if(len[end]<=E&&exhaust(end,Math.min(cap,budget-N)))won++;
      for(var i=0;i<p.length;i++)pool.push(p[i]);
    }
    return {added:N-before,won:won};
  }
  // The solver's own kind of search: depth first, moves in a random order that favours leaps, never into a dead end
  // the test can see, stopping at the first win or after dfsLeft new positions. A position all of whose moves are
  // shown lost is lost (flag 2). Says 1 for a win, 2 for lost, 0 for not known.
  var dfsLeft=0;
  function dfs(u){
    if(len[u]===1)return 1;
    if(flag[u]&2)return 2;
    if(dfsLeft<=0)return 0;
    var k=children(u),n=len[u]-1,j;
    if(k===0){flag[u]|=3;return 2;}
    var ids=[],keys=[];
    for(j=0;j<k;j++){
      if(!viable(j*52,n))continue;
      var o=j*52,h=hashOf(SC,o,n),c=find(SC,o,n,h);
      if(c<0){c=insert(SC,o,n,h,c);par[c]=u;pmv[c]=CM[j];dfsLeft--;}
      if(!hasEdge(u,c))addEdge(u,c,CM[j]);
      ids.push(c);keys.push(-Math.log(rand()+1e-12)/((CM[j]&1)?8:1));
    }
    if(!ids.length){flag[u]|=6;return 2;} // every move fails the dead-end test
    var order=[];for(j=0;j<ids.length;j++)order.push(j);order.sort(function(a,b){return keys[a]-keys[b];});
    var unknown=false;
    for(j=0;j<order.length;j++){var r=dfs(ids[order[j]]);if(r===1)return 1;if(r===0)unknown=true;}
    if(!unknown){flag[u]|=2;return 2;}
    return 0;
  }
  // Groups of such searches: the first from the deal, the rest from random positions the group has reached.
  function searchOut(cap,runs,branches){
    var g0=N,before=N,won=0,tried=0;
    for(var b=0;b<=branches&&N<budget;b++){
      var s=b?g0+((rand()*(N-g0))|0):0;if(b&&N<=g0)break;if(len[s]<=1||(flag[s]&2))continue;
      dfsLeft=Math.min(cap,budget-N);tried++;if(dfs(s)===1)won++;progress(false);
    }
    runs.tried+=tried;runs.won+=won;
    return {added:N-before};
  }
  // Keeps the first K positions (the search went in order of depth) and the moves between them.
  function truncate(K){
    var m=0,cap=Math.max(1024,NE),t2=new Int32Array(cap),n2=new Int32Array(cap),m2=new Uint8Array(cap);
    for(var u=0;u<K;u++){var e=head[u],lost=false;head[u]=-1;
      while(e>=0){var c=eto[e],nx=enext[e];if(c<K){t2[m]=c;m2[m]=emv[e];n2[m]=head[u];head[u]=m;m++;}else lost=true;e=nx;}
      if(lost)flag[u]&=~1;}
    eto=t2;enext=n2;emv=m2;NE=m;N=K;used=off[K-1]+len[K-1];
    tab.fill(0);for(var id=0;id<N;id++){var i=hsh[id]&tmask;while(tab[i])i=(i+1)&tmask;tab[i]=id+1;}
  }
  function playLine(line){
    var v=0,path=[0];
    for(var s=0;s<line.length;s++){
      var k=children(v),n=len[v]-1,j=-1;for(var t=0;t<k;t++)if(CM[t]===line[s]){j=t;break;}
      if(j<0)return null;
      var o=j*52,h=hashOf(SC,o,n),c=find(SC,o,n,h);
      if(c<0){c=insert(SC,o,n,h,c);par[c]=v;pmv[c]=CM[j];}
      if(!hasEdge(v,c))addEdge(v,c,CM[j]);
      v=c;path.push(v);
    }
    return path;
  }
  function build(q){
    t0=now();lastPost=0;reset();q2w=q.parentWeight||0;budget=Math.max(16,q.budget|0);rng=(q.rng>>>0)||0x2545F491;
    var rc=new Uint8Array(q.cards),h0=hashOf(rc,0,rc.length);insert(rc,0,rc.length,h0,find(rc,0,rc.length,h0));
    var E=q.endPiles||15,top=Math.max(1,Math.floor(budget*(q.top||0.15))),limit=t0+(q.timeLimit||120000);
    var cap1=q.skipFull?top:budget,u=0;
    phase='Searching every position';
    while(u<N&&N<cap1){expand(u);u++;if((u&1023)===0)progress(false);}
    var complete=u>=N,dives=0,diveEnds=[],linePath=null;divesWonRuns=-1;
    if(!complete){
      if(N>top)truncate(top);
      if(q.line){phase='Adding the known winning line';linePath=playLine(q.line);
        if(linePath){for(var s=0;s<linePath.length;s++)if(len[linePath[s]]===E+3){exhaust(linePath[s],Math.floor(budget*0.15));break;}}}
      phase='Playing random lines down the tree';
      var endCap=q.endCap||Math.max(300,Math.min(8000,Math.floor(budget/150))),idle=0,stop=Math.min(limit,now()+Math.max(6000,budget/50));
      var runs={tried:0,won:0};
      while(N<budget&&now()<stop&&idle<300){
        var r=q.method==='walk'?branchOut(E,endCap,diveEnds,7):searchOut(q.searchCap||Math.max(2000,Math.min(6000,Math.round(budget/170))),runs,q.branches==null?7:q.branches);
        idle=r.added?0:idle+1;progress(false);}
      dives=q.method==='walk'?diveEnds.length:runs.tried;if(q.method!=='walk')divesWonRuns=runs.won;
    }
    phase='Working out which positions win';progress(true);
    return finish(complete,dives,diveEnds,linePath);
  }
  // Which positions can still win, the fewest piles each can reach, and how many lines win: from the bottom up.
  var q2w=0;
  function finish(complete,dives,diveEnds,linePath){
    var i,e,u,d,rootLen=len[0],cnt=new Int32Array(54),ord=new Int32Array(N);

function zoomAt(f,cx,cy){
  var r=canvas.getBoundingClientRect(),v=camVectors(),w=worldPerPixel()*dpr;
  var ox=(cx-r.left-r.width/2)*w,oy=(r.height/2-(cy-r.top))*w;
  f=Math.max(0.2,Math.min(5,f));
  cam.tx+=(ox*v.r[0]+oy*v.u[0])*(1-f);cam.ty+=(ox*v.r[1]+oy*v.u[1])*(1-f);cam.tz+=(ox*v.r[2]+oy*v.u[2])*(1-f);
  if(cam.ortho)cam.oh=Math.max(0.05,cam.oh*f);else cam.dist=Math.max(0.2,cam.dist*f);dirty=true;
}
function pick(mx,my){
  if(!G||!lastM)return -1;var ys=G.ys,M=lastM,P=G.pos,W=canvas.width,H=canvas.height,x=mx*dpr,y=my*dpr,best=-1,bd=(9*dpr)*(9*dpr),bz=Infinity;
  for(var i=0;i<G.n;i++){var px=P[3*i],py=P[3*i+1]*ys,pz=P[3*i+2],w=M[3]*px+M[7]*py+M[11]*pz+M[15];if(w<=0)continue;
    var sx=((M[0]*px+M[4]*py+M[8]*pz+M[12])/w*0.5+0.5)*W,sy=(0.5-(M[1]*px+M[5]*py+M[9]*pz+M[13])/w*0.5)*H,d=(sx-x)*(sx-x)+(sy-y)*(sy-y);
    if(d<bd-0.5||(d<bd+0.5&&w<bz)){bd=d;best=i;bz=w;}}
  return best;
}
var hoverTimer=0,hoverEv=null;
function hoverAt(e){hoverEv=e;if(hoverTimer)return;hoverTimer=setTimeout(function(){hoverTimer=0;if(!G||drag||!hoverEv)return;
  var r=canvas.getBoundingClientRect(),i=pick(hoverEv.clientX-r.left,hoverEv.clientY-r.top);
  if(i<0){hideTip();return;}tip.innerHTML=shortInfo(i);tip.style.left=(hoverEv.clientX-r.left)+'px';tip.style.top=(hoverEv.clientY-r.top)+'px';tip.hidden=false;},G&&G.n>1500000?160:70);}
function hideTip(){tip.hidden=true;}

// ---------- text ----------
function fmt(x){return Math.round(x).toLocaleString('en-US');}
function big(x){if(x<1e15)return fmt(x);var e=Math.floor(Math.log10(x));return (x/Math.pow(10,e)).toFixed(1)+'&times;10<sup>'+e+'</sup>';}
function cardsOf(i){var o=G.coff[i],n=G.len[i],a=[];for(var k=0;k<n;k++)a.push(G.cards[o+k]);return a;}
function movesIn(i){return cur.base+G.depth[i];}
function outcome(i){var s=G.status[i],b=G.best[i],x=G.expanded[i];
  if(G.len[i]===1)return 'Won.';
  if(s===1)return 'A win can still be reached'+((x&8)?' ('+big(G.wins[i])+' of the '+big(G.lines[i])+' ways to play on win).':'.');
  if(s===2&&(x&4)&&!(x&1))return 'Lost: every move from here leads to a position that the solver\'s dead-end test shows cannot be won.';
  if(s===2&&(x&8))return 'Lost: the best from here is '+b+' piles.';
  if(s===2)return 'Lost: every move from here either fails the solver\'s dead-end test or was searched to the end without a win. How few piles it can end with was not worked out.';
  return 'Not settled: no win is drawn below it, and it is not shown lost'+(b<G.len[i]?'. The fewest piles drawn below it is '+b:'')+'.';}
function shortInfo(i){var s=G.status[i];return (i===0&&!cur.base?'The deal':'After '+movesIn(i)+' move'+(movesIn(i)===1?'':'s'))+': '+G.len[i]+' pile'+(G.len[i]===1?'':'s')+'. '+
  (G.len[i]===1?'Won':s===1?'Can still win':s===2?(exactAt(i)?'Lost, '+G.best[i]+' piles at best':'Lost'):'Not settled')+'.';}
function moveText(i){var p=G.parent[i];if(p<0)return '';var m=G.pmove[i],pi=m>>1,leap=m&1,pc=cardsOf(p),c=pc[pi],t=pc[pi-(leap?3:1)];
  return cardText(c)+' onto '+cardText(t)+(leap?' (a leap)':' (a slide)');}
function showStats(m){
  var h='';
  if(G.complete)h+='Every position: <b>'+fmt(G.n)+'</b>, joined by <b>'+fmt(G.ne)+'</b> moves, <b>'+G.maxDepth+'</b> moves deep.<br>';
  else h+='Drawn: <b>'+fmt(G.n)+'</b> positions and <b>'+fmt(G.ne)+'</b> moves, '+G.maxDepth+' moves deep: every position of the first moves, then <b>'+fmt(G.dives)+'</b> short searches like the solver\'s, <b>'+fmt(G.divesWon)+'</b> of which found a win.<br>';
  var s0=G.status[0];
  if(G.complete){
    if(s0===1)h+=(cur.base?'Can be won':'Won')+': <b>'+big(G.wins[0])+'</b> of the '+big(G.lines[0])+' ways to play it to the end win.';
    else h+='Lost: no line wins. The best leaves <b>'+G.best[0]+'</b> piles.';
  }else{
    h+=(s0===1?'<b>'+fmt(G.counts.win)+'</b> of the drawn positions can still win.':'No win drawn; the fewest piles drawn is <b>'+G.best[0]+'</b>.');
    if(cur.total)h+='<br>The whole tree has '+fmt(cur.total)+' positions.';
  }
  h+='<br><span style="color:#7d869c">Built in '+(G.ms/1000).toFixed(1)+' s.'+(edgeNote?' '+edgeNote:'')+'</span>';
  $('.at-stats').innerHTML=h;
}
function drawChart(){
  var w=Math.round(chart.clientWidth*dpr)||260,h=Math.round(64*dpr);chart.width=w;chart.height=h;var c=chart.getContext('2d');c.clearRect(0,0,w,h);
  if(!G)return;var L=G.layers,n=L.length,mx=1;for(var i=0;i<n;i++)if(L[i][0]>mx)mx=L[i][0];
  var bw=w/n,top=Math.log10(mx+1);
  for(i=0;i<n;i++){var t=L[i][0];if(!t)continue;var bh=Math.max(1,h*Math.log10(t+1)/top),y=h;
    var parts=[[L[i][2],WIN],[L[i][3],G.complete?LOSS[1]:LOSSX],[L[i][1],UNK]];
    for(var k=0;k<3;k++){if(!parts[k][0])continue;var ph=bh*parts[k][0]/t;c.fillStyle='rgb('+parts[k][1].join(',')+')';c.fillRect(i*bw,y-ph,Math.max(1,bw-0.5),ph);y-=ph;}}
}

// ---------- selecting a position ----------
function select(i){
  if(!G)return;G.sel=i;hl=null;
  if(i<0){nodeBox.hidden=true;dirty=true;return;}
  var up=[],v=i;while(v>=0){up.push(v);v=G.parent[v];}up.reverse();
  // Down: from a winnable position the way to a win; otherwise towards the fewest piles drawn, unsettled positions first
  // among equals; the move it is drawn joined by breaks ties.
  var down=[],win=G.status[i]===1;v=i;
  for(;;){var bestC=-1,score=-Infinity;for(var e=G.es[v];e<G.es[v+1];e++){var c=G.et[e],
      sc=(win?(G.status[c]===1?1000:0):(-4*G.best[c]+(G.status[c]===0?2:0)))+(G.parent[c]===v?1:0);if(sc>score){score=sc;bestC=c;}}
    if(bestC<0)break;down.push(bestC);v=bestC;}
  var path=up.concat(down),n=path.length,P=new Float32Array(3*n),C=new Uint8Array(4*n);
  for(var k=0;k<n;k++){var j=path[k];P[3*k]=G.pos[3*j];P[3*k+1]=G.pos[3*j+1];P[3*k+2]=G.pos[3*j+2];
    var col=k<up.length?[255,255,255]:(G.status[j]===1?GOLD:[255,120,90]);C[4*k]=col[0];C[4*k+1]=col[1];C[4*k+2]=col[2];C[4*k+3]=k===up.length-1?255:200;}
  gl.bindBuffer(gl.ARRAY_BUFFER,bufHPos);gl.bufferData(gl.ARRAY_BUFFER,P,gl.DYNAMIC_DRAW);gl.bindBuffer(gl.ARRAY_BUFFER,bufHCol);gl.bufferData(gl.ARRAY_BUFFER,C,gl.DYNAMIC_DRAW);
  hl={n:n};
  var cs=cardsOf(i);
  $('.at-node-head').innerHTML='<b>'+(i===0&&!cur.base?'The deal':'After '+movesIn(i)+' move'+(movesIn(i)===1?'':'s'))+'</b>: '+G.len[i]+' pile'+(G.len[i]===1?'':'s')+'. '+outcome(i)+
    (i?'<br>Last move: '+moveText(i)+'.':'')+(down.length?'<br><span style="color:#9aa3b5">The '+(win?'gold line shows a way to a win':exactAt(i)?'red line shows a best line':'red line leads to the fewest piles drawn')+' from here.</span>':'');
  $('.at-cards').innerHTML=cs.map(function(b){return '<div class="at-card'+(isRed(b)?' at-red':'')+'">'+RANKS[b&15].replace('T','10')+'<span>'+SYM[b>>4]+'</span></div>';}).join('');
  $('.at-explore').hidden=G.len[i]<=1||(i===0);
  nodeBox.hidden=false;dirty=true;
}

// ---------- building ----------
var worker=null,cur={cards:null,title:'',note:'',base:0,total:0,line:null,stack:[]};
function makeWorker(onPage){
  if(!onPage)try{var src='('+workerMain.toString()+')(self);',url=URL.createObjectURL(new Blob([src],{type:'text/javascript'}));var w=new Worker(url);
    setTimeout(function(){URL.revokeObjectURL(url);},60000);return w;}catch(err){}
  // No workers (an old browser, or a page or file that forbids them): build on the page, which freezes it meanwhile.
  var fake={postMessage:function(m){setTimeout(function(){if(fake.listener)fake.listener({data:m});},0);}};workerMain(fake);
  return {postMessage:function(m){setTimeout(function(){fake.onmessage({data:m});},20);},terminate:function(){fake.listener=null;},set onmessage(f){fake.listener=f;}};
}
function parseLine(cards,text){
  var tops=cards.slice(),out=[],ms=text.trim().split(/\s+/);
  for(var s=0;s<ms.length;s++){var a=cardByte(ms[s].slice(0,2)),b=cardByte(ms[s].slice(3,5)),i=tops.indexOf(a),t=tops.indexOf(b);
    if(i<0||t<0||(i-t!==1&&i-t!==3))return null;out.push(i<<1|(i-t===3?1:0));tops[t]=a;tops.splice(i,1);}
  return out;
}
var onPage=false,layoutPW=0;
function run(opts){
  if(worker)worker.terminate();
  worker=makeWorker(onPage);
  var budget=parseInt(sizeSel.value,10)||500000,heard=false,me=worker;
  busy.hidden=false;$('.at-busy span').textContent='Starting...';$('.at-busy i').style.width='0';message('');
  worker.onmessage=function(ev){
    var m=ev.data;heard=true;if(me!==worker)return;
    if(m.type==='progress'){$('.at-busy i').style.width=Math.min(100,100*m.nodes/m.budget).toFixed(1)+'%';
      $('.at-busy span').textContent=m.phase+': '+fmt(m.nodes)+' positions';}
    else if(m.type==='graph'){busy.hidden=true;setGraph(m,opts);if(host.onbuilt)host.onbuilt(m);}
    else if(m.type==='error'){busy.hidden=true;message('Could not build this tree: '+m.message+'. A smaller size may work.');}
  };
  worker.onerror=function(e){if(me!==worker)return;
    if(!heard&&!onPage){onPage=true;run(opts);return;} // the worker never started: build on the page instead
    busy.hidden=true;message('Could not build this tree ('+(e.message||'out of memory?')+'). A smaller size may work.');};
  worker.postMessage({cmd:'build',cards:opts.cards,budget:budget,top:0.15,endPiles:15,parentWeight:layoutPW,line:opts.line||null,skipFull:!!(opts.total&&opts.total>budget),
    rng:(hashStr(opts.title)^budget)>>>0||1});
}
function hashStr(s){var h=2166136261;for(var i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),16777619);return h>>>0;}
function applyShape(){
  if(!G)return;var rings=shapeSel.value==='rings';G.pos=rings?G.posR:G.posS;G.bounds=rings?G.boundsR:G.boundsS;
  var b=G.bounds,w=Math.max(b[1]-b[0],b[5]-b[4],1),hgt=Math.max(b[3]-b[2],0.8);G.ys=rings?1:Math.max(0.4,Math.min(4,1.15*w/hgt));setYs(G.ys);
  gl.bindBuffer(gl.ARRAY_BUFFER,bufPos);gl.bufferData(gl.ARRAY_BUFFER,G.pos,gl.STATIC_DRAW);
  if(G.sel>=0)select(G.sel);dirty=true;
}
// The deal's details (cur) change only when its tree arrives, so a slow or failed build leaves the page describing the
// tree on the screen.
function setGraph(m,o){
  cur.cards=o.cards;cur.title=o.title;cur.note=o.note||'';cur.base=o.base||0;cur.total=o.total||0;cur.line=o.line||null;cur.ex=o.ex||'';
  if(o.resetStack)cur.stack=[];if(o.push)cur.stack.push(o.push);if(o.pop)cur.stack.pop();exSel.value=cur.ex;
  G=m;G.sel=-1;hl=null;nodeBox.hidden=true;G.posR=m.pos;G.posS=m.pos2;G.boundsR=m.bounds;G.boundsS=m.bounds2;
  var ne=0,ni=0,nx=0;for(var i=0;i<G.n;i++){var x=G.expanded[i]&8;if(G.status[i]===2){if(x)ne++;else ni++;}if(!x&&G.status[i]!==1)nx++;}
  G.nExactLoss=ne;G.nInexactLoss=ni;G.nInexact=nx;
  applyShape();recolour();rebuildEdges();if(!o.keepView)fit(view);
  $('.at-title').textContent=cur.title;$('.at-note').innerHTML=cur.note||'';showStats();drawChart();crumbs();
  dirty=true;
}
function crumbs(){
  var c=$('.at-crumbs');c.innerHTML='';
  if(cur.stack.length){var b=document.createElement('button');b.textContent='Back';b.onclick=back;c.appendChild(b);
    var s=document.createElement('span');s.className='at-panel';s.style.padding='4px 8px';s.textContent=cur.stack.map(function(x){return x.title;}).join(' > ')+' > '+cur.title;c.appendChild(s);}
  resize();
}
function snapshot(){return {cards:cur.cards,title:cur.title,note:cur.note,base:cur.base,total:cur.total,line:cur.line,ex:cur.ex};}
function loadDeal(o){select(-1);run(o);}
function loadSeed(seedText,ex){
  var t=String(seedText).replace(/[\s,]/g,'');if(!/^\d{1,20}$/.test(t)||BigInt(t)>MASK){message('A seed is a whole number from 0 to 18,446,744,073,709,551,615.');return;}
  var cards=dealFromSeed(t),e=ex||EXAMPLES.filter(function(x){return x.seed===t;})[0];
  seedIn.value=t;
  loadDeal({cards:cards,title:'Deal '+BigInt(t).toLocaleString('en-US'),note:e?e.note:'',total:e&&e.total,line:e&&e.line?parseLine(cards,e.line):null,ex:e?e.k:'',resetStack:true});
}
function exploreFrom(i){
  if(!G||i<0)return;
  loadDeal({cards:cardsOf(i),title:'After '+movesIn(i)+' move'+(movesIn(i)===1?'':'s'),note:'The tree from the chosen position, with '+G.len[i]+' piles.',base:movesIn(i),total:0,line:null,ex:'',push:snapshot()});
}
function back(){var s=cur.stack[cur.stack.length-1];if(!s)return;var o={};for(var k in s)o[k]=s[k];o.pop=true;loadDeal(o);}

// ---------- controls ----------
exSel.onchange=function(){var e=EXAMPLES.filter(function(x){return x.k===exSel.value;})[0];if(e)loadSeed(e.seed,e);};
$('.at-go').onclick=function(){loadSeed(seedIn.value);};
seedIn.addEventListener('keydown',function(e){if(e.key==='Enter')loadSeed(seedIn.value);});
$('.at-rand').onclick=function(){loadSeed(String(Math.floor(Math.random()*1e12)));};
sizeSel.onchange=function(){if(cur.cards)run(snapshot());};
colorSel.onchange=function(){recolour();drawChart();};
shapeSel.onchange=function(){applyShape();fit(view);};
edgeSel.onchange=function(){rebuildEdges();if(G)showStats();};
glowIn.oninput=function(){dirty=true;};
host.querySelectorAll('[data-view]').forEach(function(b){b.onclick=function(){fit(b.getAttribute('data-view'));};});
$('.at-spin').onclick=function(){spin=!spin;this.classList.toggle('on',spin);};
$('.at-fit').onclick=function(){fit(view);};
var goFull=host.requestFullscreen||host.webkitRequestFullscreen,wasFull=false;
if(!goFull)$('.at-full').hidden=true;
$('.at-full').onclick=function(){if(fullNow())(document.exitFullscreen||document.webkitExitFullscreen).call(document);else if(goFull)goFull.call(host);};
$('.at-help').onclick=function(){$('.at-helpbox').hidden=!$('.at-helpbox').hidden;};
$('.at-helpclose').onclick=function(){$('.at-helpbox').hidden=true;};
$('.at-close').onclick=function(){select(-1);};
$('.at-explore').onclick=function(){if(G)exploreFrom(G.sel);};
$('.at-title').onclick=function(){side.classList.toggle('at-folded');side.setAttribute('data-touched','1');drawChart();};
$('.at-save').onclick=function(){savePicture((cur.title||'tree').replace(/[^A-Za-z0-9]+/g,'-').toLowerCase(),2);};
function fullChange(){var now=fullNow();if(now||wasFull)setTimeout(function(){resize();fit(view);drawChart();},50);wasFull=now;}
document.addEventListener('fullscreenchange',fullChange);document.addEventListener('webkitfullscreenchange',fullChange);
host.tabIndex=0;
host.addEventListener('keydown',function(e){if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
  if(e.key==='Escape')select(-1);else if(e.key===' '){spin=!spin;$('.at-spin').classList.toggle('on',spin);e.preventDefault();}else if(e.key==='r'||e.key==='R')fit(view);});
function savePicture(name,scale){
  if(!G||lost)return;var w0=canvas.width,h0=canvas.height,vp=gl.getParameter(gl.MAX_VIEWPORT_DIMS);
  var md=Math.min(gl.getParameter(gl.MAX_TEXTURE_SIZE),gl.getParameter(gl.MAX_RENDERBUFFER_SIZE),vp[0],vp[1]);
  scale=Math.max(0.25,Math.min(scale||2,md/w0,md/h0,Math.sqrt(36e6/(w0*h0)))); // at most 36 million pixels
  canvas.width=Math.round(w0*scale);canvas.height=Math.round(h0*scale);saveScale=scale;draw();
  canvas.toBlob(function(b){if(!b){message('Could not save the picture at this size; a smaller window may work.');return;}
    if(host.onsave)host.onsave(b,name+'.png');else{var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name+'.png';document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);}},'image/png');
  canvas.width=w0;canvas.height=h0;saveScale=1;dirty=true;
}

// For testing and for pictures: host.accTree.
host.accTree={load:function(o){if(o.size)sizeSel.value=String(o.size);if(o.shape)shapeSel.value=o.shape;if(o.color)colorSel.value=o.color;if(o.edges)edgeSel.value=o.edges;if(o.view)view=o.view;
    if(o.ex){var e=EXAMPLES.filter(function(x){return x.k===o.ex;})[0];if(e)loadSeed(e.seed,e);}else if(o.seed!=null)loadSeed(String(o.seed));},
  save:savePicture,fit:fit,select:select,explore:exploreFrom,pick:pick,recolour:recolour,rebuildEdges:rebuildEdges,
  set parentWeight(v){layoutPW=v;},get graph(){return G;},get camera(){return cam;},set glowLevel(v){glowIn.value=String(v);dirty=true;},examples:EXAMPLES,dealFromSeed:dealFromSeed};

// Start: from the address (?ex=, ?seed=, &size=, &view=, &shape=, &color=, &edges=, &spin=1) on its own page, else the easy example.
var qs={};try{if(document.body.classList.contains('standalone'))location.search.slice(1).split('&').forEach(function(p){var kv=p.split('=');if(kv[0])qs[decodeURIComponent(kv[0])]=decodeURIComponent(kv[1]||'');});}catch(err){}
if(qs.size&&SIZES.indexOf(+qs.size)>=0)sizeSel.value=qs.size;
if(qs.color)colorSel.value=qs.color;if(qs.shape)shapeSel.value=qs.shape;if(qs.edges)edgeSel.value=qs.edges;if(qs.view)view=qs.view;if(qs.spin==='1'){spin=true;$('.at-spin').classList.add('on');}
if(qs.seed)loadSeed(qs.seed);else{var ex0=EXAMPLES.filter(function(x){return x.k===(qs.ex||'e185');})[0]||EXAMPLES[0];loadSeed(ex0.seed,ex0);}
})();
</script>
<!-- end of acc-tree -->
