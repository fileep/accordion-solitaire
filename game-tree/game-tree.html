<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accordion game trees</title>
<style>
html,body{margin:0;height:100%;background:#05060a}
body.standalone #acc-tree{position:fixed;left:0;top:0;right:0;bottom:0;width:auto;height:auto;border-radius:0;margin:0}
</style>
</head>
<body class="standalone">
<!-- acc-tree: everything from here to "end of acc-tree" can be pasted into a blog post as it is -->
<style>
#acc-tree{position:relative;width:100%;height:680px;margin:1em 0;background:#05060a;color:#d9dce4;border-radius:10px;overflow:hidden;
  font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;user-select:none;-webkit-user-select:none}
#acc-tree:fullscreen{width:100%;height:100%;margin:0;border-radius:0}
#acc-tree:-webkit-full-screen{width:100%;height:100%;margin:0;border-radius:0}
#acc-tree *{box-sizing:border-box}
#acc-tree canvas.at-gl{position:absolute;left:0;top:0;width:100%;height:100%;display:block;cursor:grab;touch-action:pan-y}
/* In a page, one finger scrolls the page up and down; on its own page or full screen every touch drives the tree. */
body.standalone #acc-tree canvas.at-gl,#acc-tree:fullscreen canvas.at-gl,#acc-tree:-webkit-full-screen canvas.at-gl{touch-action:none}
#acc-tree canvas.at-gl.at-dragging{cursor:grabbing}
#acc-tree button,#acc-tree select,#acc-tree input{font:inherit;color:#e8eaf0;background:#161a26;border:1px solid #2c3346;border-radius:6px;padding:4px 8px;margin:0}
#acc-tree button{cursor:pointer}
#acc-tree button:hover,#acc-tree select:hover{background:#1f2536}
#acc-tree button.on{background:#2c3a63;border-color:#4d64a8}
#acc-tree input.at-seed{width:9em}
#acc-tree input.at-custom{width:8em}
#acc-tree .at-top{position:absolute;left:8px;right:8px;top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;pointer-events:none}
#acc-tree .at-top>*{pointer-events:auto}
#acc-tree .at-top select.at-ex{width:14em}
#acc-tree .at-top select.at-size{width:12em}
#acc-tree .at-tools{display:flex;gap:6px;margin-left:auto;align-items:center}
#acc-tree .at-seg{display:flex}
#acc-tree .at-seg button{border-radius:6px 0 0 6px}
#acc-tree .at-seg button+button{border-radius:0 6px 6px 0;margin-left:-1px}
#acc-tree button.at-full{padding:4px 7px;line-height:0}
#acc-tree button.at-full svg{width:14px;height:14px;vertical-align:middle}
#acc-tree .at-panel{background:rgba(9,11,18,.82);border:1px solid #232a3b;border-radius:8px;padding:8px 10px}
#acc-tree .at-side{position:absolute;left:8px;top:var(--tb,48px);width:280px;max-height:calc(100% - var(--tb,48px) - var(--kb,44px));overflow:auto}
#acc-tree .at-side.at-folded .at-body{display:none}
#acc-tree .at-hd{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
#acc-tree .at-hd button{padding:2px 7px;font-size:12px;white-space:nowrap;flex:none}
#acc-tree .at-crumbs:empty{display:none}
#acc-tree .at-title{font-weight:600;font-size:14px;cursor:pointer;min-width:0;overflow-wrap:anywhere}
#acc-tree .at-title::after{content:" \25BE";color:#7d869c;font-weight:400}
#acc-tree .at-side.at-folded .at-title::after{content:" \25B8"}
#acc-tree .at-note{color:#aab1c2;margin:4px 0 6px}
#acc-tree .at-note:empty{display:none}
#acc-tree .at-stats{margin:4px 0}
#acc-tree .at-stats b{color:#fff;font-weight:600}
#acc-tree .at-key{position:absolute;left:8px;bottom:8px;max-width:calc(100% - 16px);display:flex;flex-wrap:wrap;gap:3px 12px;font-size:12px;color:#b9bfcd;padding:5px 9px;pointer-events:none}
#acc-tree .at-key .at-what{color:#8d96aa}
#acc-tree .at-key .at-legend{display:contents}
#acc-tree .at-key i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
#acc-tree .at-key i.at-grad{width:18px;border-radius:5px}
#acc-tree .at-node{position:absolute;right:8px;top:var(--tb,48px);width:340px;max-width:calc(100% - 16px);max-height:calc(100% - var(--tb,48px) - var(--kb,44px));overflow:auto}
#acc-tree .at-node-head{margin-bottom:6px}
#acc-tree .at-cards{display:flex;flex-wrap:wrap;gap:3px;margin:6px 0}
#acc-tree .at-card{width:24px;height:30px;border-radius:4px;background:#f3f1ea;color:#1b1d22;font-weight:700;font-size:11px;line-height:1;display:flex;
  flex-direction:column;align-items:center;justify-content:center;font-family:Georgia,"Times New Roman",serif}
#acc-tree .at-card.at-red{color:#c4102a}
#acc-tree .at-card span{font-size:13px}
#acc-tree .at-node-btns{display:flex;gap:6px;flex-wrap:wrap}
/* A panel's buttons stay at its bottom edge when its cards have to scroll. */
#acc-tree .at-play>.at-node-btns,#acc-tree .at-node>.at-node-btns{position:sticky;bottom:-8px;background:rgb(9,11,18);padding:6px 0 8px;margin-bottom:-8px}
#acc-tree .at-hint{position:absolute;left:50%;bottom:var(--kb,44px);transform:translateX(-50%);width:max-content;max-width:calc(100% - 16px);pointer-events:none;font-size:12px;padding:5px 9px}
#acc-tree .at-busy{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:320px;text-align:center;pointer-events:none}
#acc-tree .at-busy.at-low{top:auto;bottom:var(--kb,44px);transform:translateX(-50%)}
#acc-tree .at-bar{height:6px;background:#1b2030;border-radius:3px;overflow:hidden;margin-bottom:6px}
#acc-tree .at-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3d6bff,#38e3a0)}
#acc-tree .at-tip{position:absolute;pointer-events:none;background:rgba(10,12,20,.92);border:1px solid #2c3346;border-radius:6px;padding:4px 7px;font-size:12px;
  white-space:nowrap;transform:translate(12px,12px)}
#acc-tree .at-helpbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;
  font-size:13px;line-height:1.45}
#acc-tree .at-helpbox p{margin:0 0 8px}
#acc-tree .at-helpbox a{color:#8fb4ff}
#acc-tree .at-helpbox .at-by{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0 0;color:#aab1c2}
#acc-tree .at-msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:420px;text-align:center}
#acc-tree [hidden]{display:none !important}
#acc-tree .at-play{position:absolute;left:8px;top:var(--tb,48px);width:min(560px,45%);max-height:calc(100% - var(--tb,48px) - var(--kb,44px));overflow:auto}
#acc-tree .at-pcards{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
#acc-tree button.at-pcard{width:30px;height:40px;padding:0;border-radius:5px;background:#f3f1ea;color:#1b1d22;font:700 12px/1 Georgia,"Times New Roman",serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid #f3f1ea}
#acc-tree button.at-pcard span{font-size:15px}
#acc-tree button.at-pcard.at-red{color:#c4102a}
#acc-tree button.at-pcard:hover{background:#fff;border-color:#fff}
#acc-tree button.at-pcard.at-none{opacity:.55}
#acc-tree button.at-pcard.at-sel{border-color:#ffd03c;box-shadow:0 0 0 2px #ffd03c}
#acc-tree button.at-pcard.at-tgt{border-color:#36e08f;box-shadow:0 0 0 2px #36e08f}
#acc-tree .at-pnote{color:#8d96aa;font-size:12px;margin-bottom:6px}
#acc-tree .at-node-btns button:disabled{opacity:.45;cursor:default}
/* Narrow blocks (a phone, or a narrow blog column): the view buttons go on the row below the top one, and the panels
   for a position and for playing open at the bottom, over the colour key. */
#acc-tree.at-narrow{font-size:12px}
#acc-tree.at-narrow .at-side{width:min(240px,calc(100% - 190px));padding:6px 8px}
#acc-tree.at-narrow .at-tools{position:absolute;right:0;top:calc(100% + 8px);margin:0;gap:5px}
#acc-tree.at-narrow input.at-seed{width:8.5em}
#acc-tree.at-narrow .at-long{display:none}
#acc-tree.at-narrow input.at-custom{width:6.5em}
#acc-tree.at-narrow .at-top select.at-ex,#acc-tree.at-narrow .at-top select.at-size{width:auto;flex:1 1 9em;min-width:0}
#acc-tree.at-narrow .at-node{top:auto;bottom:8px;width:calc(100% - 16px);max-height:42%}
#acc-tree.at-narrow.at-nodeopen .at-key,#acc-tree.at-narrow.at-playing .at-key{visibility:hidden}
/* --tt is the bottom of the view buttons' row, --pb the space the Play panel takes at the bottom. */
#acc-tree.at-narrow.at-nodeopen .at-hint{bottom:auto;top:var(--tt,84px)}
#acc-tree.at-narrow.at-playing .at-hint{top:auto;bottom:var(--pb,55%)}
#acc-tree.at-narrow .at-play{top:auto;bottom:8px;left:8px;right:8px;width:auto;max-height:55%;padding:6px 8px}
#acc-tree.at-narrow .at-play>.at-node-btns{bottom:-6px;margin-bottom:-6px;padding-bottom:6px}
#acc-tree.at-narrow .at-pcards{gap:3px;margin:6px 0}
#acc-tree.at-narrow .at-pnote{display:none}
#acc-tree.at-narrow.at-playing .at-node{bottom:auto;top:var(--tt,84px);max-height:calc(100% - var(--tt,84px) - var(--pb,55%))}
#acc-tree.at-narrow button.at-pcard{width:23px;height:31px;font-size:11px}
#acc-tree.at-narrow button.at-pcard span{font-size:13px}
/* Fingers need bigger targets. */
@media (pointer:coarse){#acc-tree button:not(.at-pcard),#acc-tree select,#acc-tree input{min-height:36px}#acc-tree button.at-full{min-width:36px}#acc-tree .at-hd button{min-height:32px}}
@media (max-width:600px){#acc-tree{height:620px;height:min(620px,80vh)}}
</style>
<div id="acc-tree"></div>
<script>
(function(){
'use strict';
var host=document.getElementById('acc-tree');
if(!host||host.getAttribute('data-ready'))return;
host.setAttribute('data-ready','1');

// ---------- cards and deals (the same generator as acc and the game) ----------
var RANKS='A23456789TJQK',SUITS='CDHS',SYM=['\u2663','\u2666','\u2665','\u2660'];
function cardByte(s){return SUITS.indexOf(s[1])<<4|RANKS.indexOf(s[0]);}
function cardText(b){return (RANKS[b&15]==='T'?'10':RANKS[b&15])+SYM[b>>4];}
function isRed(b){var s=b>>4;return s===1||s===2;}
// <deal>
var MASK=(1n<<64n)-1n;
function rotl(x,k){return ((x<<k)|(x>>(64n-k)))&MASK;}
function dealFromSeed(seed){
  var st=BigInt(seed);
  function mix(){st=(st+0x9E3779B97F4A7C15n)&MASK;var z=st;z=((z^(z>>30n))*0xBF58476D1CE4E5B9n)&MASK;z=((z^(z>>27n))*0x94D049BB133111EBn)&MASK;return z^(z>>31n);}
  var s=[mix(),mix(),mix(),mix()];
  function next(){var r=(rotl((s[1]*5n)&MASK,7n)*9n)&MASK,t=(s[1]<<17n)&MASK;s[2]^=s[0];s[3]^=s[1];s[1]^=s[2];s[0]^=s[3];s[2]^=t;s[3]=rotl(s[3],45n);return r;}
  function below(b){var n=BigInt(b);var m=next()*n;if((m&MASK)<n){var t=((1n<<64n)-n)%n;while((m&MASK)<t)m=next()*n;}return Number(m>>64n);}
  var d=[];for(var u=0;u<4;u++)for(var r=0;r<13;r++)d.push(u<<4|r);
  for(var i=51;i>0;i--){var j=below(i+1);var x=d[i];d[i]=d[j];d[j]=x;}
  return d;
}
// </deal>

// ---------- the engine: builds a deal's graph of positions in a Web Worker ----------
// <engine>
function workerMain(self){
  'use strict';
  var now=(typeof performance!=='undefined'&&performance.now)?function(){return performance.now();}:function(){return Date.now();};
  function bigger(a,n){var b=new a.constructor(n);b.set(a);return b;}
  // A position keeps only its number of piles, the position it was first reached from, the move that reached it
  // (pile<<1|leap), the card that move covered, some flags and two 32-bit hashes of its row of top cards (a pile's lower
  // cards never matter again). Rows are played again from the deal when they are needed, and a position is recognised by
  // its two hashes: two different positions share both with odds of 1 in 2^64, so even among 40 million positions the
  // odds that any two are mixed up are under 1 in 10,000.
  // The hashes are of the row's pairs of neighbours: a row's cards all differ, so its first card and which card follows
  // which fix it. With a mark (63) before the first card and after the last, a row is fixed by its set of pairs alone,
  // and each hash is the exclusive or of a random 32-bit number per pair (ZT, one table for each hash). Two different
  // rows have different sets, and the exclusive or of the numbers of the pairs only one of them has is random: so they
  // share a hash with odds of exactly 1 in 2^32, and both with 1 in 2^64. A move changes only the pairs next to the two
  // piles it touches, so a child's hashes come from its parent's with at most 7 numbers (dh), whatever the row's length.
  var ZT=new Int32Array(8192);
  (function(){var s=0x6a09e667|0;for(var k=0;k<8192;k++){s=(s+0x9e3779b9)|0;var z=s;
    z^=z>>>16;z=Math.imul(z,0x7feb352d);z^=z>>>15;z=Math.imul(z,0x846ca68b);z^=z>>>16;ZT[k]=z;}})();
  var len,par,pmv,cov,flag,hsh,hs2,tab,tmask,tmax,N=0,CAP=0,budget=0,root,n0=0,H1=0,H2=0,lastPost=0,t0=0,phase='',rng=1,q2w=0;
  var LV=[],RB=new Uint8Array(52),MV=new Uint8Array(64),QB=null,qr=0,qw=0,ES=null,ET=null,NE=0,rec=false,topMark=0;
  var EM=(1<<22)-1,grow=0;
  // Each phase's start, for the build's timings (msg.times, in ms).
  var times=[];function setPhase(p){phase=p;times.push([p,Math.round(now()-t0)]);}
  function rand(){rng^=rng<<13;rng^=rng>>>17;rng^=rng<<5;return (rng>>>0)/4294967296;}
  function reset(){
    var s=Math.min(CAP,1<<14);
    len=new Uint8Array(s);par=new Int32Array(s);pmv=new Uint8Array(s);cov=new Uint8Array(s);flag=new Uint8Array(s);hsh=new Int32Array(s);hs2=new Int32Array(s);
    tab=new Int32Array(1<<15);tmask=tab.length-1;tmax=(tab.length*0.7)|0;grow=0;N=0;NE=0;ES=null;ET=null;QB=null;
  }
  function release(){len=par=pmv=cov=flag=hsh=hs2=tab=DT=null;ES=ET=QB=TH=RA=null;}
  // A depth laid out during the search, for the page to show while the rest is built.
  var TH=null,RA=null;
  function sendLayer(d,a,b){var P=new Float32Array(3*(b-a));for(var i=a,k=0;i<b;i++,k+=3){P[k]=RA[i]*Math.cos(TH[i]);P[k+1]=-d*0.8;P[k+2]=RA[i]*Math.sin(TH[i]);}
    self.postMessage({type:'layer',depth:d,start:a,pos:P},[P.buffer]);}
  function room(m){
    var s=m>CAP?Math.ceil(m*1.25):Math.max(m,Math.min(len.length*2,CAP));
    len=bigger(len,s);par=bigger(par,s);pmv=bigger(pmv,s);cov=bigger(cov,s);flag=bigger(flag,s);hsh=bigger(hsh,s);hs2=bigger(hs2,s);
  }
  // A row's hashes, from scratch. The pair of cards a then b is numbered a<<7|b<<1 (|1 for the second hash).
  function hashes(b,o,n){
    var h=0,g=0,p=63,q;
    for(var k=0;k<n;k++){var x=b[o+k];q=p<<7|x<<1;h^=ZT[q];g^=ZT[q|1];p=x;}
    q=p<<7|126;H1=h^ZT[q];H2=g^ZT[q|1];
  }
  // How move mv changes hash f (0 or 1) of the row of n cards at b[o]: the card c at i goes onto the one at t.
  // A step drops the pairs (l,x) and (x,c) and makes (l,c); a leap drops (l,x), (x,y), (z,c) and (c,r) and makes (l,c),
  // (c,y) and (z,r).
  function dh(b,o,n,mv,f){
    var i=mv>>1,c=b[o+i],t,l,x;
    if(mv&1){t=i-3;l=t?b[o+t-1]:63;x=b[o+t];var y=b[o+t+1],z=b[o+i-1],r=i+1<n?b[o+i+1]:63;
      return ZT[l<<7|c<<1|f]^ZT[l<<7|x<<1|f]^ZT[x<<7|y<<1|f]^ZT[c<<7|y<<1|f]^ZT[z<<7|c<<1|f]^ZT[c<<7|r<<1|f]^ZT[z<<7|r<<1|f];}
    t=i-1;l=t?b[o+t-1]:63;x=b[o+t];
    return ZT[l<<7|c<<1|f]^ZT[l<<7|x<<1|f]^ZT[x<<7|c<<1|f];
  }
  function find(n){var i=H1&tmask;for(;;){var v=tab[i];if(v===0)return -1-i;var id=v-1;if(hsh[id]===H1&&hs2[id]===H2&&len[id]===n)return id;i=(i+1)&tmask;}}
  function rehash(size){var t=new Int32Array(size),m=size-1;for(var id=0;id<N;id++){var i=hsh[id]&m;while(t[i])i=(i+1)&m;t[i]=id+1;}tab=t;tmask=m;tmax=(size*0.7)|0;}
  function insert(slot,n,p,m,c){
    if(N>=len.length)room(N+1);
    len[N]=n;par[N]=p;pmv[N]=m;cov[N]=c;flag[N]=0;hsh[N]=H1;hs2[N]=H2;
    tab[-1-slot]=N+1;var id=N++;if(N>tmax)rehash(grow>tab.length?grow:tab.length*2);return id;
  }
  function level(n){var L=LV[n];if(!L)L=LV[n]={sc:new Uint8Array(52*104),cm:new Uint8Array(104),cv:new Uint8Array(104),h1:new Int32Array(104),id:new Int32Array(104),jx:new Int32Array(104),h2:new Int32Array(104),key:new Float64Array(104)};return L;}
  // The same moves without writing the rows out: each row's first hash, from the first hash hp of the row b[o].
  function moves(b,o,n,L,hp){
    var k=0,cm=L.cm,cv=L.cv,h1=L.h1;
    for(var i=1;i<n;i++){var c=b[o+i];
      for(var leap=0;leap<2;leap++){var d=leap?3:1;if(i<d)continue;var t=i-d,x=c^b[o+t];
        if((x&0xF0)!==0&&(x&0x0F)!==0)continue;
        var mv=i<<1|leap;cm[k]=mv;cv[k]=b[o+t];h1[k]=hp^dh(b,o,n,mv,0);k++;}}
    return k;
  }
  // The search in order of depth looks positions up in a table of the next depth's alone (a move from depth d can
  // only reach depth d+1), made afresh as each depth starts, so it is far smaller than one of every position. Slot s
  // holds a row's two hashes and its number plus one (0: empty) in DT[3s], DT[3s+1] and DT[3s+2], so a look-up reads
  // one place in memory. The table has dS=c*2^k slots, c from 4 to 7 (so it can be made close to the size it needs),
  // and hash h starts at slot (h>>>(29-k))*c>>>3.
  var DT=null,dS=0,dsh=0,dcm=0,dmax=0,dcnt=0;
  function dsize(s){var k=29-Math.clz32(s);dS=s;dsh=29-k;dcm=s>>>k;dmax=Math.floor(s*0.75);}
  // An empty table for about m positions (in the last one's memory, if it is big enough).
  function newDT(m){
    m=Math.max(1<<15,Math.ceil(m/0.75)+1);var k=0;while((8<<k)<m)k++;var c=Math.ceil(m/(1<<k));if(c<4)c=4;if(c===8){c=4;k++;}
    var sz=c<<k,w=3*sz,buf=DT&&DT.buffer;
    if(buf&&buf.byteLength>=4*w){DT=new Int32Array(buf,0,w);DT.fill(0);}else DT=new Int32Array(w);
    dsize(sz);dcnt=0;
  }
  function rehashD(size){
    var o=DT,e=o.length,t=new Int32Array(3*size);dsize(size);
    for(var p=0;p<e;p+=3){var v=o[p+2];if(v===0)continue;var h=o[p],i=Math.imul(h>>>dsh,dcm)>>>3;while(t[3*i+2]){if(++i===size)i=0;}
      var q=3*i;t[q]=h;t[q+1]=o[p+1];t[q+2]=v;}
    DT=t;
  }
  // Looks up the row after move j of L (from the row b[o], whose second hash is gp); says -1-slot if it isn't there,
  // and then sets H1 and H2 for inserting it.
  function findc(b,o,n,L,j,gp){
    var h=L.h1[j],s=Math.imul(h>>>dsh,dcm)>>>3,g=0,got=false;
    for(;;){var p=3*s,v=DT[p+2];if(v===0)break;
      if(DT[p]===h){if(!got){g=gp^dh(b,o,n,L.cm[j],1);got=true;}if(DT[p+1]===g)return v-1;}
      if(++s===dS)s=0;}
    H1=h;H2=got?g:gp^dh(b,o,n,L.cm[j],1);
    return -1-s;
  }
  function insertd(slot,n,p,m,c){
    if(N>=len.length)room(N+1);
    len[N]=n;par[N]=p;pmv[N]=m;cov[N]=c;flag[N]=0;hsh[N]=H1;hs2[N]=H2;
    var q=-3*(1+slot);DT[q]=H1;DT[q+1]=H2;DT[q+2]=N+1;var id=N++;if(++dcnt>dmax)rehashD(2*dS);return id;
  }
  // The keys finish finds the moves with: a row's key is the xor of a number for each (place, card), so the keys of

  if(e.key==='Escape'){select(-1);$('.at-helpbox').hidden=true;}});
// Pictures for the documents, larger than the screen (host.accTree.save).
function savePicture(name,scale){
  if(!G||lost)return;var w0=canvas.width,h0=canvas.height,vp=gl.getParameter(gl.MAX_VIEWPORT_DIMS);
  var md=Math.min(gl.getParameter(gl.MAX_TEXTURE_SIZE),gl.getParameter(gl.MAX_RENDERBUFFER_SIZE),vp[0],vp[1]);
  scale=Math.max(0.25,Math.min(scale||2,md/w0,md/h0,Math.sqrt(36e6/(w0*h0)))); // at most 36 million pixels
  canvas.width=Math.round(w0*scale);canvas.height=Math.round(h0*scale);saveScale=scale;draw();
  canvas.toBlob(function(b){if(!b){message('Could not save the picture at this size; a smaller window may work.');return;}
    if(host.onsave)host.onsave(b,name+'.png');else{var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name+'.png';document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);}},'image/png');
  canvas.width=w0;canvas.height=h0;saveScale=1;dirty=true;
}

// The drawing settings from the address or host.accTree.load: color (outcome, best, depth), edges (tree, all, none)
// and shape (rings, spindle). They apply to the next tree drawn.
function setModes(o){
  if(['outcome','best','depth'].indexOf(o.color)>=0)colorMode=o.color;
  if(['tree','all','none'].indexOf(o.edges)>=0)edgeMode=o.edges;
  if(['rings','spindle'].indexOf(o.shape)>=0)shapeMode=o.shape;
}
// For testing and for pictures: host.accTree.
host.accTree={load:function(o){if(o.size)setSize(parseSize(o.size));setModes(o);if(o.view)view=o.view;
    var e=o.ex&&EXAMPLES.filter(function(x){return x.k===o.ex;})[0];if(e){started=true;loadSeed(e.seed,e);}else if(o.seed!=null){started=true;loadSeed(String(o.seed));}},
  save:savePicture,fit:fit,select:select,explore:exploreFrom,pick:pick,recolour:recolour,rebuildEdges:rebuildEdges,
  set parentWeight(v){layoutPW=v;},get graph(){return G;},get camera(){return cam;},set glowLevel(v){glowLevel=Math.max(-2,Math.min(2,+v||0));dirty=true;},examples:EXAMPLES,dealFromSeed:dealFromSeed,
  play:{start:startPlay,stop:stopPlay,move:doMove,undo:undoMove,hint:hintMove,legal:legal,get state(){return play;}}};

// Start: from the address (?ex=, ?seed=, &size=, &view=, &shape=, &color=, &edges=), else the easy example. In a page the
// first tree is built only when the block comes near the screen.
var qs={},started=false;try{location.search.slice(1).split('&').forEach(function(p){var kv=p.split('=');if(kv[0])qs[decodeURIComponent(kv[0])]=decodeURIComponent(kv[1]||'');});}catch(err){}
// A big size in the address of a blog page applies only on a computer with the memory for it.
if(qs.size){var qv=parseSize(qs.size);if(qv>4000000&&!document.body.classList.contains('standalone')&&(small||mem<8))qv=Math.min(qv,1000000);setSize(qv);}
setModes(qs);if(qs.view)view=qs.view;
function start(){if(started)return;started=true;
  if(!(qs.seed&&loadSeed(qs.seed))){var ex0=EXAMPLES.filter(function(x){return x.k===(qs.ex||'e185');})[0]||EXAMPLES[0];loadSeed(ex0.seed,ex0);}}
if(document.body.classList.contains('standalone')||!window.IntersectionObserver)start();
else{var io=new IntersectionObserver(function(es){if(es[es.length-1].isIntersecting){io.disconnect();start();}},{rootMargin:'400px 0px'});io.observe(host);}
})();
</script>
<!-- end of acc-tree -->
